<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}} · Clarity R2R</title>
<style>
{{FONT_FACES}}

:root{
  --bg:#111111;
  --gold:#FFC500;
  --text:#F0F0F0;
  --muted:#8A8A8A;
  --box:#1C1C1C;
  --border:#525252;
  --gold-box:#251C05;
  --gold-border:#9E7B0D;
  --f:1;   /* type scale, one value for the whole document, set by the packer */
  --a:0;   /* extra air, 0 to 1, set per page by the packer */
}

*{ box-sizing:border-box; margin:0; padding:0; }

@page{ size:A4; margin:0; }

html,body{ background:var(--bg); }

body{
  font-family:'Poppins', 'Segoe UI', Arial, sans-serif;
  color:var(--text);
  font-size:calc(11.3px * var(--f));
  line-height:1.5;
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact;
}

/* Blocks are authored into #source, then the script below packs them into A4 pages. */
#source{ width:210mm; padding:0 16mm; }

.page{
  width:210mm;
  height:297mm;
  overflow:hidden;
  background:var(--bg);
  padding:10mm 16mm 8mm;
  display:flex;
  flex-direction:column;
  page-break-after:always;
  break-after:page;
}
.page:last-child{ page-break-after:auto; break-after:auto; }

.logo{ display:block; flex:0 0 auto; align-self:center; width:112px; aspect-ratio:333/101; }   /* fixed ratio: layout must not wait for the image to decode */
.page.first .logo{ width:186px; }
.body{ flex:1 1 0; min-height:0; overflow:hidden; padding-top:5mm; }
.page.first .body{ padding-top:8mm; }

.block{ margin-bottom:calc(5mm + 4mm * var(--a)); }
.body > .block:last-child{ margin-bottom:0; }
/* a page with a little room left over spreads its blocks down to the footer */
.body.spread{ display:flex; flex-direction:column; justify-content:space-between; }
.body.spread > .block{ flex:0 0 auto; margin-bottom:0; }

a{ color:inherit; text-decoration:none; }

/* ---- Headline ---- */
.headline{ text-align:center; }
.headline h1{ font-size:1.9em; font-weight:700; line-height:1.2; }
.headline h1 span{ color:var(--gold); }

/* ---- Comparison table ---- */
table.compare{
  width:100%;
  border-collapse:collapse;
  border:1px solid var(--border);
  background:var(--box);
  font-size:0.95em;
}
table.compare th{
  text-align:left;
  color:var(--gold);
  font-weight:600;
  background:var(--gold-box);
  border-bottom:1px solid var(--gold-border);
  padding:2.6mm 2.4mm;
}
table.compare td{
  vertical-align:top;
  padding:calc(2.6mm + 1.6mm * var(--a)) 2.4mm;
  border-top:1px solid var(--border);
  line-height:1.4;
}
table.compare td.biz{ font-weight:700; width:17%; }
table.compare td:nth-child(2){ width:21%; }
table.compare td:nth-child(3){ width:18%; }
table.compare td:nth-child(4){ width:23%; }

/* ---- Company card ---- */
.card{
  background:var(--box);
  border:1px solid var(--border);
  padding:calc(4.2mm + 3.4mm * var(--a)) 5.5mm;
}
.card h2{ color:var(--gold); font-weight:700; font-size:2em; line-height:1.15; }
.card .descriptor{ font-weight:600; margin-top:1mm; }
.card .descriptor .url{ color:var(--gold); text-decoration:underline; text-decoration-thickness:0.6px; text-underline-offset:1.6px; }
.card .locations{
  color:var(--gold);
  font-weight:600;
  font-size:0.8em;
  letter-spacing:.03em;
  margin-top:1mm;
}
.card .pitch{ font-size:1.13em; line-height:calc(1.45 + 0.13 * var(--a)); margin-top:calc(2mm + 1.6mm * var(--a)); }
.card ul{ list-style:none; margin-top:calc(2.6mm + 1.8mm * var(--a)); }
.card li{ position:relative; padding-left:4.2mm; margin-bottom:calc(1.5mm + 1.5mm * var(--a)); line-height:calc(1.42 + 0.13 * var(--a)); }
.card li:last-child{ margin-bottom:0; }
.card li::before{
  content:"";
  position:absolute;
  left:0.6mm;
  top:0.62em;
  width:1.2mm;
  height:1.2mm;
  border-radius:50%;
  background:var(--text);
}
.card li b{ color:var(--gold); font-weight:600; }

/* podcast appearances by the firm's leaders, YouTube links */
.watch{ margin-top:calc(2.6mm + 1.8mm * var(--a)); line-height:1.5; }
.watch .label{
  color:var(--gold);
  font-weight:700;
  font-size:0.82em;
  letter-spacing:.04em;
  margin-right:1.6mm;
}
.watch .label::before{
  content:"";
  display:inline-block;
  margin-right:1.3mm;
  border-left:1.9mm solid var(--gold);
  border-top:1.15mm solid transparent;
  border-bottom:1.15mm solid transparent;
}
.watch a{ text-decoration:underline; text-decoration-thickness:0.6px; text-underline-offset:1.6px; }
.watch .sep{ color:var(--muted); margin:0 1.2mm; }

.fit{
  margin-top:calc(3mm + 2mm * var(--a));
  background:var(--gold-box);
  border:1px solid var(--gold-border);
  padding:calc(2.6mm + 1.6mm * var(--a)) 3.6mm;
}
.fit .label{
  color:var(--gold);
  font-weight:700;
  font-size:0.82em;
  letter-spacing:.04em;
  margin-bottom:0.8mm;
}
.fit p{ line-height:calc(1.45 + 0.13 * var(--a)); }

/* ---- Footer ---- */
.footer{
  position:relative;
  flex:0 0 auto;
  padding-top:3mm;
  text-align:center;
  font-size:0.86em;
  line-height:1.6;
  color:var(--muted);
}
.footer .tag{ display:block; color:var(--gold); font-weight:600; }
.footer .num{ position:absolute; right:0; bottom:0; font-size:0.85em; }
</style>
</head>
<body>
  <div id="source">
{{BLOCKS}}
  </div>

  <template id="page-tpl">
    <div class="page">
      <img class="logo" src="{{LOGO_SRC}}" alt="Clarity R2R">
      <div class="body"></div>
      <div class="footer">
        {{FOOTER_CONTACT}}
        <span class="tag">{{TAGLINE}}</span>
        <span class="num"></span>
      </div>
    </div>
  </template>

  <script>
    /* Pack blocks into A4 pages, then use the page. A block (table, card) never splits. */
    /* Wait for the embedded fonts first: measuring in the fallback font under-counts the height. */
    function layout() {
      var root = document.documentElement;
      var source = document.getElementById('source');
      var blocks = Array.prototype.slice.call(source.children);
      var tpl = document.getElementById('page-tpl');
      var pages = [];

      function newPage() {
        var page = tpl.content.firstElementChild.cloneNode(true);
        if (!pages.length) page.classList.add('first');
        document.body.appendChild(page);
        pages.push(page);
        return page;
      }
      /* room left under the last block, keeping a little air above the footer */
      function slack(page) {
        var body = page.querySelector('.body');
        var last = body.lastElementChild;
        if (!last) return 0;
        return body.getBoundingClientRect().bottom - 4 - last.getBoundingClientRect().bottom;
      }
      function overflows(page) { return slack(page) < 0; }

      function pack() {
        pages.forEach(function (p) { p.remove(); });
        pages = [];
        var page = newPage();
        var oversize = [];
        blocks.forEach(function (block) {
          var body = page.querySelector('.body');
          body.appendChild(block);
          if (overflows(page) && body.children.length > 1) {
            body.removeChild(block);
            page = newPage();
            body = page.querySelector('.body');
            body.appendChild(block);
          }
          if (overflows(page)) oversize.push(block.getAttribute('data-name') || block.className);
        });
        return oversize;
      }

      function shape() {
        return pages.map(function (p) { return p.querySelector('.body').children.length; }).join('|');
      }
      function setType(f) { root.style.setProperty('--f', f.toFixed(2)); return pack(); }

      /* 1. Pack at the base size. That fixes the pages and reports any card that is too long. */
      var oversize = pack();

      /* 2. One type size for the whole document: the largest that keeps every block on its page. */
      if (!oversize.length) {
        var want = shape();
        var best = 1;
        for (var f = 1.12; f > 1.001; f -= 0.02) {
          if (!setType(f).length && shape() === want) { best = f; break; }
        }
        if (best === 1) setType(1);
      }

      /* 3. Per page, open up the spacing until the page is full, so no page ends in dead space. */
      var MM = 96 / 25.4;
      pages.forEach(function (page) {
        if (overflows(page)) return;
        var lo = 0, hi = 1;
        for (var i = 0; i < 8; i++) {
          var mid = (lo + hi) / 2;
          page.style.setProperty('--a', mid.toFixed(3));
          if (overflows(page)) hi = mid; else lo = mid;
        }
        page.style.setProperty('--a', lo.toFixed(3));
        /* 4. A small remainder is shared out between the blocks. A big one stays at the bottom:
              stretching a short last page would look worse than leaving it. */
        var body = page.querySelector('.body');
        var gaps = body.children.length - 1;
        if (gaps > 0 && slack(page) / gaps <= 12 * MM) body.classList.add('spread');
      });

      source.remove();
      pages.forEach(function (p, i) { p.querySelector('.num').textContent = String(i + 1); });
      var fill = pages.map(function (p) {
        var body = p.querySelector('.body').getBoundingClientRect();
        var last = p.querySelector('.body').lastElementChild.getBoundingClientRect();
        return Math.round(100 * (last.bottom - body.top) / body.height);
      });
      root.setAttribute('data-fill', fill.join('|'));
      root.setAttribute('data-oversize', oversize.join('|'));
      root.setAttribute('data-pages', String(pages.length));
    }
    document.fonts.ready.then(layout);
  </script>
</body>
</html>
