<div class="cover">
  <svg class="art" viewBox="0 0 480 300" aria-label="Clarity R2R palette and roundel pattern">
    <!--
      blocks: gold 288x300 slab (brand), surface 192x184 and gold-surface 192x116 satellites; tokens gold, surface, gold-surface
      arrangement: one tall gold slab bleeding off the right edge with two dark satellites stacked on its left
      pattern: rings from radius-photo, echoing the r2r roundel in the wordmark, the one shape Clarity is known by
      steps: space-4 (32) ring pitch, space-2 (16) ring stroke inset; radius-photo (50%) for every ring, radius-card on the satellites
    -->
    <rect class="surface card" x="0" y="0" width="192" height="184"/>
    <rect class="goldsurface card" x="0" y="184" width="192" height="116"/>
    <rect class="gold" x="192" y="0" width="288" height="300"/>
    <circle class="ring-dark" cx="336" cy="150" r="96"/>
    <circle class="ring-dark" cx="336" cy="150" r="64"/>
    <circle class="ring-dark" cx="336" cy="150" r="32"/>
    <circle class="ring-gold" cx="96" cy="92" r="48"/>
    <circle class="ring-gold" cx="96" cy="92" r="24"/>
  </svg>
  <div class="name">
    <div class="title">Clarity R2R</div>
    <div class="tag">we place recruitment leadership</div>
  </div>
</div>

  .gold { fill: var(--gold); }
  .surface { fill: var(--surface); }
